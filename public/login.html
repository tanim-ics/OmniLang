<!DOCTYPE html>
<html lang="en" data-theme="dark-glass">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniLang — Sign In to German Learning</title>
    <link rel="icon" type="image/png" href="assets/omnilang-icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;">

    <div class="glass-card fade-in" style="max-width:460px;width:100%;padding:2.5rem 2rem;position:relative;overflow:hidden;">
        <div style="text-align:center;margin-bottom:2rem;">
            <a href="index.html" class="app-brand" style="justify-content:center;margin-bottom:0.75rem;" title="OmniLang Home">
                <img src="assets/omnilang-logo-dark.png" alt="OmniLang" class="logo-dark-theme" style="height:105px;width:auto;filter:drop-shadow(0 6px 24px rgba(6,182,212,0.45));">
                <img src="assets/omnilang-logo-light.png" alt="OmniLang" class="logo-light-theme" style="height:105px;width:auto;filter:drop-shadow(0 6px 24px rgba(6,182,212,0.45));">
            </a>
            <p style="font-size:0.95rem;color:var(--text-secondary);margin-top:0.35rem;font-weight:500;">Your local-first German AI Learning Platform</p>
        </div>

        <div id="loginError" style="display:none;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:0.75rem 1rem;border-radius:var(--radius-md);font-size:0.85rem;margin-bottom:1.25rem;"></div>

        <form id="loginForm" style="display:flex;flex-direction:column;gap:1.25rem;" autocomplete="off">
            <div>
                <label style="font-size:0.8125rem;font-weight:700;color:var(--text-secondary);display:block;margin-bottom:0.4rem;">Choose Avatar</label>
                <div class="avatar-picker-grid" id="loginAvatarGrid" style="grid-template-columns:repeat(6,1fr);margin-bottom:0.5rem;">
                    <button type="button" class="avatar-option-btn selected" data-av="🇩🇪">🇩🇪</button>
                    <button type="button" class="avatar-option-btn" data-av="🦅">🦅</button>
                    <button type="button" class="avatar-option-btn" data-av="🥨">🥨</button>
                    <button type="button" class="avatar-option-btn" data-av="🏰">🏰</button>
                    <button type="button" class="avatar-option-btn" data-av="🚀">🚀</button>
                    <button type="button" class="avatar-option-btn" data-av="🦉">🦉</button>
                </div>
            </div>

            <div>
                <label style="font-size:0.8125rem;font-weight:700;color:var(--text-secondary);display:block;margin-bottom:0.4rem;">Username</label>
                <input type="text" id="loginUsername" class="select-control-input" placeholder="e.g. Tanim" required autocomplete="off" style="padding:0.8rem 1rem;font-size:0.95rem;">
                <span style="font-size:0.75rem;color:var(--text-muted);display:block;margin-top:0.3rem;">New username? We'll create your profile automatically.</span>
            </div>

            <div>
                <label style="font-size:0.8125rem;font-weight:700;color:var(--text-secondary);display:block;margin-bottom:0.4rem;">Your German CEFR Level</label>
                <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:0.35rem;" id="loginLevelGrid">
                    <button type="button" class="btn-ghost" data-lvl="A1" style="border:1px solid var(--border-glass);padding:0.5rem 0.25rem;text-align:center;">
                        <strong style="display:block;font-size:0.85rem;">A1</strong>
                        <span style="font-size:0.6rem;color:var(--text-muted);">Beginner</span>
                    </button>
                    <button type="button" class="btn-ghost active" data-lvl="A2" style="border:1px solid var(--border-glass-glow);background:var(--primary-light);color:var(--primary);padding:0.5rem 0.25rem;text-align:center;">
                        <strong style="display:block;font-size:0.85rem;">A2</strong>
                        <span style="font-size:0.6rem;color:var(--primary);">Elementary</span>
                    </button>
                    <button type="button" class="btn-ghost" data-lvl="B1" style="border:1px solid var(--border-glass);padding:0.5rem 0.25rem;text-align:center;">
                        <strong style="display:block;font-size:0.85rem;">B1</strong>
                        <span style="font-size:0.6rem;color:var(--text-muted);">Interm.</span>
                    </button>
                    <button type="button" class="btn-ghost" data-lvl="B2" style="border:1px solid var(--border-glass);padding:0.5rem 0.25rem;text-align:center;">
                        <strong style="display:block;font-size:0.85rem;">B2</strong>
                        <span style="font-size:0.6rem;color:var(--text-muted);">Upper Int.</span>
                    </button>
                    <button type="button" class="btn-ghost" data-lvl="C1" style="border:1px solid var(--border-glass);padding:0.5rem 0.25rem;text-align:center;">
                        <strong style="display:block;font-size:0.85rem;">C1</strong>
                        <span style="font-size:0.6rem;color:var(--text-muted);">Advanced</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="loginSubmitBtn" style="justify-content:center;padding:0.85rem;font-size:0.95rem;margin-top:0.5rem;">
                <span>Start Learning</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div style="text-align:center;margin-top:1.5rem;font-size:0.75rem;color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:0.4rem;">
            <i class="fa-solid fa-lock"></i> Local-first &middot; Running on Port 5001 &middot; No cloud keys required
        </div>
    </div>

    <script>
        let selectedLvl = 'A2';
        let selectedAv = '🇩🇪';

        document.querySelectorAll('#loginAvatarGrid .avatar-option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#loginAvatarGrid .avatar-option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedAv = btn.dataset.av;
            });
        });

        document.querySelectorAll('#loginLevelGrid button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#loginLevelGrid button').forEach(b => {
                    b.classList.remove('active');
                    b.style.background = '';
                    b.style.borderColor = 'var(--border-glass)';
                    b.style.color = '';
                });
                btn.classList.add('active');
                btn.style.background = 'var(--primary-light)';
                btn.style.borderColor = 'var(--border-glass-glow)';
                btn.style.color = 'var(--primary)';
                selectedLvl = btn.dataset.lvl;
            });
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const errEl = document.getElementById('loginError');
            const submitBtn = document.getElementById('loginSubmitBtn');

            if (!username) {
                errEl.textContent = 'Please enter a username.';
                errEl.style.display = 'block';
                return;
            }

            errEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin spin-anim"></i> Signing in…';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, level: selectedLvl, avatar: selectedAv })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Login failed');

                localStorage.setItem('tanim_auth', JSON.stringify(data));
                window.location.href = 'dashboard.html';
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Start Learning</span> <i class="fa-solid fa-arrow-right"></i>';
            }
        });
    </script>
</body>
</html>
